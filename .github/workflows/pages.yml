name: Deploy OrchTrade website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Basic static-site validation
        run: |
          test -s index.html
          test -s styles.css
          test -s site.js
          test -s CNAME
          test -s favicon.ico
          test -s assets/orchtrade-ot-teal.svg
          grep -q '<html lang="en">' index.html
          grep -qx 'orchtrade.com' CNAME
          test -s terms-and-conditions/index.html
          test -s disclaimer/index.html
          test -s assets/showcase/dashboard.svg
          test -s assets/showcase/full-chart.svg
          grep -q 'Terms &amp; Conditions' index.html
          grep -q 'Trading Risk &amp; AI Disclaimer' index.html
      - name: Validate SEO metadata, sitemap and public links
        run: python3 tests/seo.py
      - name: Responsive browser checks (phones, tablets, desktop)
        run: |
          npm install --prefix /tmp/orchtrade-responsive-ci --no-save --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH=/tmp/orchtrade-responsive-ci/node_modules node tests/responsive.cjs
      - name: Stage only static public assets
        run: |
          mkdir -p dist
          cp index.html styles.css site.js favicon.svg favicon.ico CNAME robots.txt sitemap.xml llms.txt .nojekyll dist/
          cp -R assets dist/
          cp -R mt5-account-monitoring trading-journal ai-backtesting ai-trading-analysis forex-market-charts dist/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist/assets/showcase')
          manifest = {'/assets/showcase/' + p.name: True for p in root.glob('*.webp')}
          (root / 'manifest.json').write_text(json.dumps(manifest))
          PY
          mkdir -p dist/terms-and-conditions dist/disclaimer
          cp terms-and-conditions/index.html dist/terms-and-conditions/index.html
          cp disclaimer/index.html dist/disclaimer/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages artifact is visible to the Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload finalization can precede visibility in the REST API.
          # Only publish after the artifact for this exact run is discoverable.
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || true)
            if [[ "$count" == "1" ]]; then
              echo "Pages artifact is visible for run $GITHUB_RUN_ID."
              exit 0
            fi
            echo "Artifact metadata not ready (attempt $attempt/24)."
            if [[ "$attempt" != "24" ]]; then sleep 5; fi
          done
          echo "::error::Expected exactly one non-expired github-pages artifact for the current run."
          exit 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
